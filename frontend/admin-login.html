<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Dindigul Public Complaint Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #f4f6f9; }
        .login-box { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>
    <div class="container login-box">
        <div class="section-card" style="text-align: center;">
            <div class="logo-area">
                <img src="images/tvk-logo.png" class="logo-circle" alt="TVK Logo" style="width: 80px; height: 80px; object-fit: cover; background: white; margin: 0 auto 20px; border-radius: 50%;">
            </div>
            <h2 style="color: var(--primary-red);">Admin Login</h2>
            <p style="margin-bottom: 20px; color: var(--text-light);">Dindigul Public Complaint Portal</p>
            
            <div id="alertBox" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
