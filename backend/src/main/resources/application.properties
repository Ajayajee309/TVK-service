spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration (PostgreSQL for Render / Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://db.trfcigracylzxrsqqmtp.supabase.co:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
