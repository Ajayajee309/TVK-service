spring.application.name=backend
server.port=8080

# Database Configuration (H2 File-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/complaintsdb
spring.datasource.username=SA
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (Custom Property)
app.jwtSecret=DindigulPublicComplaintPortalSecretKeyForJWTAuth2026!@#$
app.jwtExpirationMs=86400000

# CORS Configuration
app.cors.allowedOrigins=*
